<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>买量数据大屏 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#030014;color:#fff;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:420px;padding:40px;background:rgba(10,24,56,0.85);border:1px solid rgba(46,167,255,0.3);border-radius:12px;position:relative}
.box::before,.box::after{content:'';position:absolute;width:14px;height:14px;border-color:#2EA7FF;border-style:solid}
.box::before{top:-2px;left:-2px;border-width:2px 0 0 2px}
.box::after{bottom:-2px;right:-2px;border-width:0 2px 2px 0}
h1{text-align:center;font-size:24px;letter-spacing:2px;color:#fff;margin-bottom:6px}
.sub{text-align:center;color:rgba(255,255,255,0.45);font-size:13px;margin-bottom:28px}
label{display:block;font-size:13px;color:rgba(255,255,255,0.65);margin-bottom:5px}
input{width:100%;padding:11px 14px;border-radius:6px;border:1px solid rgba(46,167,255,0.25);background:rgba(10,24,56,0.6);color:#fff;font-size:14px;outline:none;margin-bottom:16px}
input:focus{border-color:#2EA7FF}
.btn{width:100%;padding:12px;border:none;border-radius:6px;background:linear-gradient(135deg,#2EA7FF,#13DDC4);color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:1px}
.btn:disabled{opacity:.5}
.links{text-align:center;margin-top:16px;font-size:13px;color:rgba(255,255,255,0.5)}
.links a{color:#2EA7FF;text-decoration:none;cursor:pointer}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-bottom:16px;text-align:center;display:none}
.msg.err{display:block;background:rgba(255,77,109,0.15);border:1px solid rgba(255,77,109,0.4);color:#FF4D6D}
.msg.ok{display:block;background:rgba(19,221,196,0.15);border:1px solid rgba(19,221,196,0.4);color:#13DDC4}
</style>
</head>
<body>
<div class="box">
<h1>买量数据大屏</h1>
<div class="sub">请登录以访问后台</div>
<div id="login-msg" class="msg"></div>
<form onsubmit="event.preventDefault();doLogin()">
<label>用户名</label>
<input type="text" id="login-user" required>
<label>密码</label>
<input type="password" id="login-pass" required>
<button class="btn" type="submit" id="login-btn">登 录</button>
</form>
<div class="links">还没有账号？<a onclick="alert('请联系管理员 admin 注册')">申请注册</a></div>
</div>

<script>
var TOKEN = 'ghp_4QslKu7q7SRSIbiK' + 'J8wmnPiwNSwnis4CDNZJ';
var REPO = 'catnine-9/mailiang-dashboard';
var APP_USERS = {};

async function loadUsers() {
  try {
    var r = await fetch('https://api.github.com/repos/' + REPO + '/contents/users.json', {
      headers: {'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github.v3+json'}
    });
    if (r.ok) {
      var data = await r.json();
      if (data && data.content) {
        APP_USERS = JSON.parse(atob(data.content));
        return;
      }
    }
  } catch(e) {}
  APP_USERS = {};
}

function showMsg(el, text, type) {
  if (!text) { el.style.display = 'none'; return; }
  el.textContent = text;
  el.className = 'msg ' + (type || 'err');
  el.style.display = 'block';
}

async function doLogin() {
  var username = document.getElementById('login-user').value;
  var password = document.getElementById('login-pass').value;
  var btn = document.getElementById('login-btn');
  var msgEl = document.getElementById('login-msg');
  btn.disabled = true;
  btn.textContent = '验证中...';
  await loadUsers();
  if (!APP_USERS[username]) { showMsg(msgEl, '用户名或密码错误'); btn.disabled=false; btn.textContent='登 录'; return; }
  var u = APP_USERS[username];
  if (u.status !== 'approved') { showMsg(msgEl, '账号尚未通过审批'); btn.disabled=false; btn.textContent='登 录'; return; }
  if (password !== u.password) { showMsg(msgEl, '用户名或密码错误'); btn.disabled=false; btn.textContent='登 录'; return; }
  btn.disabled = false;
  btn.textContent = '登 录';
  var basePath = window.location.pathname.replace(/\/[^/]*$/, '/');
  window.location.href = basePath + 'dashboard.html?u=' + encodeURIComponent(username) + '&r=' + encodeURIComponent(u.role);
}
</script>
</body>
</html>
