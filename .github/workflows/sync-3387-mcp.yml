name: Sync 3387 MCP Data

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_mcp_3387.py"
      - ".github/workflows/sync-3387-mcp.yml"
  schedule:
    # Primary: every 10 minutes (UTC)
    - cron: "*/10 * * * *"
    # Backup offset by 5 minutes
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mailiang-3387-mcp
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync 3387 MCP data
        run: python scripts/sync_mcp_3387.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged; skip commit"
          else
            git commit -m "data: auto-sync 3387 MCP $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi